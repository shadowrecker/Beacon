# CI pipeline. Every job must pass before merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, types, schema, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://beacon:beacon@localhost:5432/beacon_test
      TEST_DATABASE_URL: postgresql://beacon:beacon@localhost:5432/beacon_test
      TEST_REDIS_URL: redis://localhost:6379/1
      SHADOW_DATABASE_URL: postgresql://beacon:beacon@localhost:5432/beacon_shadow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Create shadow database
        run: PGPASSWORD=beacon psql -h localhost -U beacon -d beacon_test -c "CREATE DATABASE beacon_shadow;"
      - run: npx prisma validate
      - name: Migration drift check
        run: ./scripts/check-migration-drift.sh
      - run: npm run type-check
      - run: npm run lint
      - name: Unit + integration tests (with coverage gate)
        run: npm run test:coverage

  completeness:
    name: Completeness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Every tRPC procedure has a UI caller (or is allowlisted)
        run: npx tsx scripts/check-procedure-coverage.ts
      - name: No mock/sample data in UI
        run: ./scripts/check-no-mock-data.sh
      - name: No orphan files, exports or dependencies
        run: npx knip

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Dependency audit (fail on unaccepted high/critical)
        run: npx tsx scripts/check-audit.ts
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build app, worker, SDK and images
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # No secrets present: the build must not need them.
      - run: npm run build
      - run: npm run worker:build
      - name: Build SDK
        working-directory: packages/sdk
        run: npx tsc -p tsconfig.json
      - name: Build images
        run: |
          docker build -t beacon-web:${{ github.sha }} .
          docker build -f Dockerfile.worker -t beacon-worker:${{ github.sha }} .
      - name: Scan images
        # Pinned by commit: this action's version tags were rewritten in a
        # March 2026 supply-chain compromise and the old tags were removed.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beacon-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://beacon:beacon@localhost:5432/beacon
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3200
      # Production boot requirements (src/lib/env.ts); test values only.
      # CREDENTIALS_ENCRYPTION_KEYS is generated per run (step below).
      STORAGE_DRIVER: s3
      S3_BUCKET: e2e-bucket
      CLERK_WEBHOOK_SECRET: whsec_e2e
      # A Clerk development instance and a test user in it (signed-in journeys).
      # Without these secrets (e.g. a fresh fork), the server boots with a
      # placeholder key for example.clerk.accounts.dev and only the public suite
      # runs; tests that render pages or sign in skip with a stated reason.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY || 'sk_test_placeholder_no_clerk_instance' }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}  # gitleaks:allow placeholder for example.clerk.accounts.dev, not a real key
      E2E_CLERK_INSTANCE: ${{ secrets.CLERK_TEST_SECRET_KEY != '' && '1' || '0' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      # AI-backed journey steps run only when model keys are provided.
      E2E_AI: ${{ secrets.ANTHROPIC_API_KEY != '' && '1' || '0' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-unset' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-unset' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Generate a throwaway credentials encryption key
        run: |
          KEYS="{\"1\":\"$(openssl rand -base64 32)\"}"
          echo "::add-mask::$KEYS"
          echo "CREDENTIALS_ENCRYPTION_KEYS=$KEYS" >> "$GITHUB_ENV"
      - run: npm run db:migrate:deploy
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
