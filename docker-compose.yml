# Production-like stack: web + worker + Postgres (pgvector) + Redis.
#
#   cp .env.example .env.production && edit it
#   docker compose --env-file .env.production up -d --build
#   docker compose run --rm migrate     # apply migrations (release step)
#
# Postgres and Redis are on an internal network only (no host ports).
# Secrets come from the env file, never from this file.

name: beacon

x-app-env: &app-env
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-beacon}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal, public]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    # Long LLM jobs need time to finish on deploy (matches SHUTDOWN_GRACE_MS).
    stop_grace_period: 130s
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    <<: *app-env
    entrypoint: ["npx", "--yes", "prisma@6.19.3", "migrate", "deploy"]
    command: []
    profiles: [release]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beacon} -d ${POSTGRES_DB:-beacon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction; AOF persistence so queued jobs survive restarts.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    internal: true
  public: {}
